<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brillance Châtre • Bijoux en Argent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap');

        body { font-family: 'Inter', system_ui, sans-serif; }
        .logo-font { font-family: 'Playfair Display', serif; }

        .hero-bg, #intro-screen {
            background: url('https://i.postimg.cc/5tg289zv/grok-image-4e93bb87-fc80-4ddd-82a9-2cfdc81710bf.jpg') center/cover no-repeat fixed;
        }
    </style>
</head>
<body class="bg-white text-zinc-900 scroll-smooth">

    <!-- VIDEO INTRO (Kept as you liked) -->
    <div id="intro-screen" class="fixed inset-0 z-[9999] flex items-center justify-center hero-bg">
        <div class="relative w-full h-full flex flex-col items-center justify-center px-4">
            <video id="intro-video" class="absolute inset-0 w-full h-full object-cover" autoplay loop muted playsinline>
                <source src="https://jumpshare.com/s/R41YeysQrOLNTwolhgvO" type="video/mp4">
            </video>

            <!-- Framed Content (Kept as requested) -->
            <div class="relative z-10 text-center bg-black/40 backdrop-blur-md px-10 py-12 rounded-3xl border border-white/30 shadow-2xl">
                <img src="https://i.postimg.cc/xXLWm86w/Gemini-Generated-Image-2026-04-03-at-14-33-12.png" 
                     alt="Brillance Châtre" class="w-52 h-52 md:w-64 md:h-64 mx-auto rounded-full object-contain border-8 border-white shadow-2xl mb-8">

                <h1 class="logo-font text-5xl md:text-6xl font-bold tracking-wider mb-8 text-white">BRILLANCE CHÂTRE</h1>

                <button onclick="enterWebsite()" 
                        class="bg-white text-black text-lg font-semibold px-10 py-5 rounded-full flex items-center gap-3 hover:scale-105 transition">
                    ENTRER SUR LE SITE <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content" class="hidden">

        <!-- NAVBAR -->
        <nav class="bg-white border-b sticky top-0 z-50 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="https://i.postimg.cc/xXLWm86w/Gemini-Generated-Image-2026-04-03-at-14-33-12.png" 
                         alt="Brillance Châtre" class="w-10 h-10 rounded-full object-contain border border-zinc-200">
                    <div>
                        <h1 class="logo-font text-2xl font-bold tracking-tighter">BRILLANCE</h1>
                        <p class="text-zinc-500 text-xs tracking-widest">CHÂTRE</p>
                    </div>
                </div>

                <div class="hidden md:flex gap-8 text-sm font-medium">
                    <a onclick="navigateTo('home')" class="cursor-pointer hover:text-zinc-600">Accueil</a>
                    <a onclick="navigateTo('shop')" class="cursor-pointer hover:text-zinc-600">Collection</a>
                    <a onclick="showContact()" class="cursor-pointer hover:text-zinc-600">Contact</a>
                </div>

                <button onclick="showCart()" class="relative flex items-center gap-2 border border-zinc-200 px-5 py-3 rounded-3xl">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-zinc-900 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold">0</span>
                </button>

                <button onclick="toggleMobileMenu()" class="md:hidden text-3xl">☰</button>
            </div>

            <div id="mobile-menu" class="hidden md:hidden bg-white border-t px-6 py-6 text-lg">
                <a onclick="navigateTo('home');toggleMobileMenu()" class="block py-4 border-b">🏠 Accueil</a>
                <a onclick="navigateTo('shop');toggleMobileMenu()" class="block py-4 border-b">💎 Collection</a>
                <a onclick="showContact();toggleMobileMenu()" class="block py-4">✉️ Contact Us</a>
            </div>
        </nav>

        <!-- HERO -->
        <section id="home" class="hero-bg min-h-screen flex items-center py-12">
            <div class="max-w-7xl mx-auto px-4 text-center">
                <img src="https://i.postimg.cc/xXLWm86w/Gemini-Generated-Image-2026-04-03-at-14-33-12.png" 
                     alt="Brillance Châtre" class="mx-auto w-52 h-52 md:w-64 md:h-64 rounded-full object-contain border-8 border-white shadow-2xl mb-8">
                <h1 class="logo-font text-5xl md:text-6xl font-bold tracking-tighter text-white drop-shadow-lg">BRILLANCE CHÂTRE</h1>
                <p class="mt-3 text-lg md:text-xl text-white">Bijoux en argent fin • Casablanca</p>
            </div>
        </section>

        <!-- SHOP -->
        <section id="shop" class="max-w-7xl mx-auto px-4 py-12 bg-white">
            <h2 class="text-3xl font-semibold text-center mb-10 text-zinc-800">Nos Bracelets</h2>
            <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
        </section>

        <!-- FOOTER -->
        <footer class="bg-zinc-100 py-12 text-center">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex justify-center gap-10 text-4xl mb-8 text-zinc-700">
                    <a href="https://www.instagram.com/brillance_chatre" target="_blank" class="hover:text-pink-500"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://wa.me/212720114319" target="_blank" class="hover:text-green-500"><i class="fa-brands fa-whatsapp"></i></a>
                </div>
                <p class="text-xs text-zinc-500">© 2026 Brillance Châtre • Casablanca, Maroc</p>
            </div>
        </footer>
    </div>

    <!-- PRODUCT MODAL -->
    <div id="product-modal" class="hidden fixed inset-0 bg-black/70 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden">
            <div class="relative">
                <button onclick="closeProductModal()" class="absolute top-4 right-4 text-4xl text-zinc-400">×</button>
                <img id="modal-image" class="w-full h-80 object-cover" alt="">
            </div>
            <div class="p-6">
                <h2 id="modal-name" class="text-2xl font-semibold text-zinc-800"></h2>
                <p id="modal-desc" class="text-zinc-500 mt-3"></p>
                <p id="modal-price" class="text-4xl font-bold text-zinc-800 mt-6"></p>
                <button onclick="addCurrentToCart()" class="w-full mt-8 bg-zinc-900 text-white py-5 rounded-3xl font-semibold text-lg">Ajouter au Panier</button>
            </div>
        </div>
    </div>

    <script>
        let products = [
            {id:1, name:"Bracelet rivière argent rhodié oxydes de zirconium", price:350, desc:"Size 4:4", img:"https://i.postimg.cc/Wzmm7vbC/0E0060B0-2A87-45AF-8FFF-58E60A00BE89.jpg"},
            {id:2, name:"Bracelet « Trio éclat » argent 925 zircon baguette", price:220, desc:"", img:"https://i.postimg.cc/mk33SsgW/2BF28342-EA5F-44C7-988E-55A35B61AE3E.jpg"},
            {id:3, name:"Éclat Royal – Bracelet en argent 925 avec pierre carrée halo", price:189, desc:"", img:"https://i.postimg.cc/ZnPPLSK1/9305FEE1-21B8-48AE-BDDD-6A79069744F6.jpg"},
            {id:4, name:"Bracelet \"Couronne Royale\" – Argent Sterling 925", price:200, desc:"", img:"https://i.postimg.cc/fy77vNT2/A366801C-1ADA-41C8-BF50-ADA1F2D23442.jpg"},
            {id:5, name:"Bracelet \"Infini Éternel\" en Argent 925", price:220, desc:"", img:"https://i.postimg.cc/90PPBhFN/59FC592C-79B8-49F6-9D3C-9F1C3D8CD577.jpg"},
            {id:6, name:"Bracelet \"Flocon de Neige\" Multicercle — Argent Sterling S925", price:300, desc:"", img:"https://i.postimg.cc/4yvv1gxT/FED40C3C-BB9D-4BE6-A07B-14C1322B4D43.jpg"},
            {id:7, name:"Bracelet \"Clou de Lumière\" en Argent 925", price:200, desc:"", img:"https://i.postimg.cc/sxPPJrDH/FC9C83A5-8658-4EC7-B05C-8B6F29918424.jpg"},
            {id:8, name:"Bracelet \"Amulettes de Chance\" Multi-Breloques — Argent S925", price:270, desc:"", img:"https://i.postimg.cc/bY1RPQHv/623f2882-00a3-4bd4-8078-5cebda5f29ef.jpg"},
            {id:9, name:"Bracelet \"Soleils d'Orient\" Multicharmes — Argent S925", price:240, desc:"", img:"https://i.postimg.cc/wM55kpj8/E4DC34BE-B5F3-4C79-A819-3469E672D608.jpg"},
            {id:10, name:"Bracelet Cœur Noir Précieux en Argent 925", price:230, desc:"", img:"https://i.postimg.cc/zDTkNnSX/75D23800-253D-4C51-950B-0D63CDE6F9AB.jpg"},
            {id:11, name:"Bracelet \"Pulsation Verte\" – Argent Sterling 925", price:230, desc:"", img:"https://i.postimg.cc/Bb55C0Qm/E52F95A7-5DC9-48C5-B0DD-867803507900.jpg"},
            {id:12, name:"Bracelet \"Splendeur d'Orient\" – Argent Sterling 925", price:440, desc:"", img:"https://i.postimg.cc/Y0NNxHqz/ABBA0B94-7E22-4CF9-9E8D-62F9F1E3C87F.jpg"}
        ];

        let cart = [];
        let currentProduct = null;

        function enterWebsite() {
            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            }, 800);
        }

        function renderProducts() {
            const container = document.getElementById('products-grid');
            container.innerHTML = '';
            products.forEach(p => {
                container.innerHTML += `
                <div onclick="showProductModal(${p.id})" class="product-card bg-white rounded-3xl overflow-hidden border border-zinc-100 shadow-sm cursor-pointer">
                    <img src="${p.img}" class="w-full aspect-square object-cover">
                    <div class="p-4">
                        <div class="font-medium text-sm line-clamp-2">${p.name}</div>
                        <div class="flex justify-between items-center mt-4">
                            <span class="font-bold text-xl">${p.price} DH</span>
                            <button onclick="event.stopImmediatePropagation(); addToCart(${p.id});" 
                                    class="bg-zinc-900 text-white px-5 py-2 rounded-2xl text-sm">Ajouter</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        function showProductModal(id) {
            currentProduct = products.find(p => p.id === id);
            document.getElementById('modal-image').src = currentProduct.img;
            document.getElementById('modal-name').textContent = currentProduct.name;
            document.getElementById('modal-desc').textContent = currentProduct.desc || "Élégant bracelet en argent 925";
            document.getElementById('modal-price').textContent = currentProduct.price + " DH";
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function addCurrentToCart() {
            if (currentProduct) addToCart(currentProduct.id);
            closeProductModal();
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(i => i.id === id);
            if (existing) existing.quantity = (existing.quantity || 1) + 1;
            else cart.push({...product, quantity: 1});
            updateCartCount();
            alert("✅ " + product.name + " ajouté au panier !");
        }

        function updateCartCount() {
            const count = cart.reduce((a, c) => a + (c.quantity || 1), 0);
            document.getElementById('cart-count').textContent = count;
        }

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        function navigateTo(section) {
            document.getElementById(section).scrollIntoView({ behavior: 'smooth' });
            document.getElementById('mobile-menu').classList.add('hidden');
        }

        function showContact() {
            alert("📍 Brillance Châtre\nCasablanca, Maroc\nWhatsApp: +212 720 114 319");
        }

        function showCart() {
            alert("🛍️ Panier ouvert\nTotal articles : " + cart.length);
        }

        window.onload = () => {
            renderProducts();
        };
    </script>
</body>
</html>
